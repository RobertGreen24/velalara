# The installer substitutes the panel DNS name in this template.
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/velalara/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panel.example.com;
    ssl_certificate /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/velalara/public;
    index index.php;
    client_max_body_size 512k;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 360s;
        fastcgi_param PHP_ADMIN_VALUE "max_execution_time=360";
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
